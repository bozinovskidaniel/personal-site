<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img">
  <style>
    .bg { fill: #fafafa; }
    .ink { fill: #404040; }
    .muted { fill: #a3a3a3; }
    .on-ink { fill: #fafafa; }
    .field { fill: #ffffff; stroke: #d4d4d4; }
    .field-on { fill: #404040; stroke: #404040; }
    .line { stroke: #a3a3a3; }
    .led { fill: #ffffff; stroke: #404040; }
    text { font-family: Inter, ui-sans-serif, -apple-system, system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #141414; }
      .ink { fill: #d4d4d4; }
      .muted { fill: #737373; }
      .on-ink { fill: #141414; }
      .field { fill: #0a0a0a; stroke: #333333; }
      .field-on { fill: #d4d4d4; stroke: #d4d4d4; }
      .line { stroke: #525252; }
      .led { fill: #0a0a0a; stroke: #d4d4d4; }
    }
  </style>

  <rect class="bg" width="1200" height="600" />

  <!-- Register name and address -->
  <text class="ink mono" x="80" y="140" font-size="24" font-weight="600">GPIOA_MODER</text>
  <text class="muted mono" x="1120" y="140" font-size="20" text-anchor="end">0x4002 0000</text>

  <!-- 16 two-bit mode fields, pin 15 on the left down to pin 0 -->
  <g class="mono" font-size="22" text-anchor="middle">
    <rect class="field" x="80" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="145" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="210" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="275" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="340" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="405" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="470" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="535" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="600" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="665" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field-on" x="730" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="795" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="860" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="925" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="990" y="200" width="65" height="90" stroke-width="2" />
    <rect class="field" x="1055" y="200" width="65" height="90" stroke-width="2" />

    <text class="muted" x="112.5" y="253">00</text>
    <text class="muted" x="177.5" y="253">00</text>
    <text class="muted" x="242.5" y="253">00</text>
    <text class="muted" x="307.5" y="253">00</text>
    <text class="muted" x="372.5" y="253">00</text>
    <text class="muted" x="437.5" y="253">00</text>
    <text class="muted" x="502.5" y="253">00</text>
    <text class="muted" x="567.5" y="253">00</text>
    <text class="muted" x="632.5" y="253">00</text>
    <text class="muted" x="697.5" y="253">00</text>
    <text class="on-ink" x="762.5" y="253" font-weight="600">01</text>
    <text class="muted" x="827.5" y="253">00</text>
    <text class="muted" x="892.5" y="253">00</text>
    <text class="muted" x="957.5" y="253">00</text>
    <text class="muted" x="1022.5" y="253">00</text>
    <text class="muted" x="1087.5" y="253">00</text>
  </g>

  <!-- Bit positions -->
  <g class="muted mono" font-size="15">
    <text x="84" y="188">31</text>
    <text x="762.5" y="188" text-anchor="middle">11:10</text>
    <text x="1116" y="188" text-anchor="end">0</text>
  </g>

  <!-- Pin numbers -->
  <g class="muted mono" font-size="16" text-anchor="middle">
    <text x="112.5" y="320">15</text>
    <text x="177.5" y="320">14</text>
    <text x="242.5" y="320">13</text>
    <text x="307.5" y="320">12</text>
    <text x="372.5" y="320">11</text>
    <text x="437.5" y="320">10</text>
    <text x="502.5" y="320">9</text>
    <text x="567.5" y="320">8</text>
    <text x="632.5" y="320">7</text>
    <text x="697.5" y="320">6</text>
    <text class="ink" x="762.5" y="320" font-weight="600">5</text>
    <text x="827.5" y="320">4</text>
    <text x="892.5" y="320">3</text>
    <text x="957.5" y="320">2</text>
    <text x="1022.5" y="320">1</text>
    <text x="1087.5" y="320">0</text>
  </g>

  <!-- The write that sets it -->
  <text class="ink mono" x="80" y="452" font-size="24">GPIOA-&gt;MODER |= (1 &lt;&lt; 10);</text>
  <text class="muted mono" x="80" y="492" font-size="20">// PA5: general purpose output</text>

  <!-- Pin 5 driving an LED -->
  <line class="line" x1="762.5" y1="336" x2="762.5" y2="414" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" />
  <g stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path class="led" d="M742 418h41l-20.5 34Z" />
    <path class="led" d="M740 452h45" fill="none" />
    <path class="led" d="M795 424l14-12m-8 0h8v8M803 440l14-12m-8 0h8v8" fill="none" />
  </g>
  <text class="ink mono" x="830" y="452" font-size="20">PA5</text>
  <text class="muted" x="830" y="478" font-size="17">LED</text>
</svg>
